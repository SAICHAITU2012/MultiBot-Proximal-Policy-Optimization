algorithm_type: PPO
policy_backbone:
  hidden_dims:
    __tuple__:
    - 256
    - 256
    - 128
  activation: RELU
  network_type: MLP
critic_backbone:
  hidden_dims:
    __tuple__:
    - 256
    - 256
    - 128
  activation: RELU
  network_type: MLP
lr: 0.001
value_lr: null
lr_type: ADAPTIVE
lr_adaptive_factor: 1.5
lr_min: 1.0e-05
lr_max: 0.01
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
value_loss_coef: 1.0
entropy_coef: 0.005
max_grad_norm: 1.0
target_kl: 0.01
use_clipped_value_loss: true
init_std: 1.0
num_epochs: 3
num_mini_batches: 16
rollout_length: 24
optimizer_type: ADAM
weight_decay: 0.0
